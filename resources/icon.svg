<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#0b0d18"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9db2ff"/>
      <stop offset="1" stop-color="#5a74f0"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- Wing: three feathers sweeping up and back from the envelope's left edge -->
  <g fill="url(#wing)">
    <path d="M418 520 C 330 470 240 380 196 262 C 290 300 380 360 448 440 Z"/>
    <path d="M410 586 C 310 560 214 500 156 404 C 262 420 356 466 432 528 Z" opacity="0.85"/>
    <path d="M412 650 C 316 650 226 616 160 548 C 262 548 352 572 426 612 Z" opacity="0.7"/>
  </g>
  <!-- Envelope, tilted as if in flight -->
  <g transform="rotate(-12 600 560)">
    <rect x="388" y="410" width="460" height="310" rx="36" fill="#ffffff"/>
    <path d="M404 432 L 618 588 L 832 432" fill="none" stroke="#5a74f0" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
