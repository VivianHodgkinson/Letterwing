name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs and website changes don't need a full build (tag pushes always build)
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            args: --linux
          - name: Windows
            os: windows-latest
            args: --win
          - name: macOS
            os: macos-latest
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install packaging tools
        if: runner.os == 'Linux'
        # rpm for .rpm, bsdtar (libarchive-tools) for the Arch .pacman package
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # The built-in "Sign in with Google / Microsoft" apps (repository secrets; see docs/SETUP.md)
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAIN_VITE_MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MAIN_VITE_MICROSOFT_TENANT: ${{ secrets.MICROSOFT_TENANT }}
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Unsigned builds for now: no Apple / Windows code-signing certificates
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: Letterwing-${{ matrix.name }}
          if-no-files-found: error
          # latest*.yml and .blockmap files are what installed copies use to auto-update
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
            !dist/builder-debug.yml
            !dist/builder-effective-config.yaml

  release:
    name: Draft release
    # Only after every package has built, so a draft never appears half-uploaded
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release with all files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "${GITHUB_REF_NAME#v}" \
            --notes "Letterwing ${GITHUB_REF_NAME#v}"
